name: Weekly IP Verification & Cleanup

on:
  schedule:
    - cron: "0 1 * * 0"  # Every Sunday at 01:00 UTC
  workflow_dispatch:

jobs:
  verify-and-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify all IPs
        run: |
          > /tmp/alive.txt
          while IFS= read -r ip; do
            [ -z "$ip" ] && continue
            # Try to use this IP as proxy (SOCKS5)
            result=$(curl -s --max-time 8 -x "socks5h://$ip:1080" "https://ipinfo.io/ip" 2>/dev/null)
            if echo "$result" | grep -qE "^[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}$"; then
              echo "$ip" >> /tmp/alive.txt
              continue
            fi
            # Try common ports
            for port in 1080 1081 7890 10808 8080 4145; do
              result=$(curl -s --max-time 6 -x "socks5h://$ip:$port" "https://ipinfo.io/ip" 2>/dev/null)
              if echo "$result" | grep -qE "^[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}$"; then
                echo "$ip" >> /tmp/alive.txt
                break
              fi
            done
          done < ips.txt
          
          sort -u -t. -k1,1n -k2,2n -k3,3n -k4,4n /tmp/alive.txt > ips.txt
          echo "Alive IPs: $(wc -l < ips.txt)"

      - name: Update README
        run: |
          sed -i "s/Total IPs:.*/Total IPs: $(wc -l < ips.txt)/" README.md
          sed -i "s/Last updated:.*/Last updated: $(date -u +%Y-%m-%d)/" README.md

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ips.txt README.md
          git diff --quiet && git diff --staged --quiet || git commit -m "Weekly cleanup: $(date -u +%Y-%m-%d)"
          git push

